<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>67 | Social Links</title>

    <!-- أيقونة التبويب في المتصفح (Favicon) -->
    <link rel="icon" type="image/png" href="blue-67.png">

    <!-- مكتبة Font Awesome للأيقونات الرسمية -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;

            /* طبقة غامقة شفافة فوق الصورة لضمان وضوح النصوص */
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                        url('WhatsApp Image 2026-09-26 at 3.50.04 AM.jpeg');
            
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        /* تعديل كلاس اللوجو لإلغاء الدائرة */
        .logo {
            margin: 0 auto -15px;
            display: inline-block;
        }

        /* التحكم في حجم اللوجو مباشرة */
        .logo img {
            margin-bottom: -60px;
            width: 300px; /* تقدر تكبر أو تصغر الحجم من هنا */
            height: auto;  /* يحافظ على أبعاد الصورة الأصلية */
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); /* ظل خفيف للوجو ليعطيه مظهر احترافي */
        }

        h1 {
            font-size: 34px;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            font-size: 20px;
            margin-bottom: 28px;
            font-weight: bold;
        }

        /* Social buttons */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            position: relative;

            width: 100%;
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
            color: white;

            background: rgba(255,255,255,0.07);

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 16px;

            backdrop-filter: blur(12px);

            font-size: 16px;
            font-weight: 600;

            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);

            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            cursor: pointer;
        }

        /* تنسيق الأيقونات الرسمية */
        .link i {
            position: absolute;
            left: 20px;
            font-size: 22px;
            transition: transform 0.3s ease;
        }

        .link:hover i {
            transform: scale(1.15);
        }

        .link:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.14);
        }

        .link:active {
            transform: scale(0.97);
        }

        /* ألوان التضيء والتفاعل الخاصة لكل منصة عند الـ Hover */
        .btn-facebook:hover {
            border-color: #1877f2;
            box-shadow: 0 8px 25px rgba(24, 119, 242, 0.35);
        }

        .btn-tiktok:hover {
            border-color: #ff0050;
            box-shadow: 0 8px 25px rgba(255, 0, 80, 0.35);
        }

        .btn-instagram:hover {
            border-color: #e4405f;
            box-shadow: 0 8px 25px rgba(228, 64, 95, 0.35);
        }

        .btn-whatsapp:hover {
            border-color: #25d366;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.35);
        }

        .btn-phone:hover {
            border-color: #0088cc;
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.35);
        }

        .btn-share:hover {
            border-color: #ffb703;
            box-shadow: 0 8px 25px rgba(255, 183, 3, 0.35);
        }

        /* Footer */
        .footer {
            margin-top: 28px;
            color: #aaa;
            font-size: 12px;
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding-top: 45px;
            }

            .logo img {
                width: 95px;
            }

            h1 {
                font-size: 31px;
            }

            .link {
                min-height: 60px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Logo بدون إطار دائرية -->
        <div class="logo">
            <img src="IMG_20260926_041053-removebg-preview.png" alt="67 Logo">
        </div>


        <p class="subtitle" style="color: white;" bold>
        تابعونا علي مواقع التواصل الاجتماعي <BR>
        العنوان:٤ عماير البترول المهندسين احمد عرابي</BR>
        </p>

        <!-- Social Links -->
        <div class="links">

            <!-- Facebook -->
            <a
                class="link btn-facebook"
                href="https://www.facebook.com/share/19fPAbqbi7/?mibextid=wwXIfr"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="fa-brands fa-facebook-f"></i>
                Facebook
            </a>

            <!-- TikTok -->
            <a
                class="link btn-tiktok"
                href="https://www.tiktok.com/@67_six__seven_1?_r=1&_t=ZS-9A2W0azPOHE"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="fa-brands fa-tiktok"></i>
                TikTok
            </a>

            <!-- Instagram -->
            <a
                class="link btn-instagram"
                href="https://www.instagram.com/67_six_seven_1?stkn=MW4xdHRmbzJlOWVnMg%3D%3D&utm_source=qr"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="fa-brands fa-instagram"></i>
                Instagram
            </a>

            <!-- WhatsApp -->
            <a
                class="link btn-whatsapp"
                href="https://chat.whatsapp.com/KCh3dYdLeByIwvvTo59yU1?mode=gi_t"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="fa-brands fa-whatsapp"></i>
                WhatsApp Group
            </a>

            
            <!-- زرار مشاركة الصفحة -->
            <button class="link btn-share" onclick="sharePage()">
                <i class="fa-solid fa-share-nodes"></i>
                <span id="share-text">Share Page</span>
            </button>

        </div>

        <div class="footer">
            © 2026 67
        </div>

    </main>

    <script>
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: '67 | Social Links',
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                const shareText = document.getElementById('share-text');
                shareText.innerText = 'Link Copied!';
                setTimeout(() => {
                    shareText.innerText = 'Share Page';
                }, 2000);
            }
        }
    </script>

</body>
</html>
